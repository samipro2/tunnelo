name: build-mac
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyQt6 pyinstaller
      - run: pyinstaller --windowed --name Tunnelo tunnelo.py
      - run: codesign --force --deep -s - dist/Tunnelo.app
      - run: hdiutil create -volname Tunnelo -srcfolder dist/Tunnelo.app -ov -format UDZO Tunnelo-apple-silicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Tunnelo-apple-silicon
          path: Tunnelo-apple-silicon.dmg
